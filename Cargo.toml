[package]
name = "temporion-x86-rust-reference"
version = "0.1.0"
edition = "2021"
description = "Retained Rust reference for testing the separate Temporion x86 assembly project."
license = "AGPL-3.0-only"
repository = "https://github.com/MasterZack69/temporion-x86"

# Reference implementation only; production is built by Make/Nix.
# All reference sensor logic lives here; the GNOME extension is a thin GJS reader.
# No external crates on purpose: std-only + a tiny hand-written NVML FFI.

[[bin]]
name = "temporion-x86d-rust-reference"
path = "src/main.rs"

[profile.release]
opt-level = "s"      # optimize for size; the work is trivial anyway
lto = true
codegen-units = 1
panic = "abort"      # no unwinding needed for a leaf daemon
strip = true

name: Daemon correctness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Check
      run: cargo check --verbose
    - name: Run tests
      run: cargo test --verbose

    - name: Build Rust reference
      run: cargo build --release
    - name: Build and test assembly against Rust
      run: make test differential
    - name: Build benchmark executables and speed-optimized Rust
      run: make bench-build
    - name: Check speed-optimized Rust parity
      run: TEMPORION_RUST_BIN="$PWD/build/temporiond-rust-speed" python3 tests/integration.py
